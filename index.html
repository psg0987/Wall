["신용등급과 파산","부채/자본 비율로 AAA~D 등급이 매겨집니다. 순자산이 자산의 -25% 아래면 법정관리(기존 주주 지분 소멸), 두 번째는 상장폐지입니다."],

["AI 설정","기본은 규칙 기반 분석이라 무료입니다. Claude를 고르면 이 앱 안에서 Claude가 리포트와 조언을 쓰고, 사용량이 듭니다. 제미나이는 내 API 키로 호출하는데, claude.ai 안에서는 외부 연결이 막혀 있어 앱(APK) 버전에서만 작동합니다."],
["은행과 대출 회수","모든 회사는 거래 은행에서 돈을 빌립니다. 은행 경영권을 잡으면 대출 장부에서 신용 BB 이하 고객의 대출을 50%까지 회수하거나 신용을 동결할 수 있어요. 현금이 모자란 회사는 자산을 헐값에 팔고, 그래도 모자라면 법정관리에 들어갑니다. 라이벌이 내 거래 은행을 지배하면 거꾸로 당할 수 있으니 내 은행으로 옮기세요."],["회사채","내 회사는 자본의 20~40%만큼 10년 고정금리 회사채를 한 번에 한 종류 발행할 수 있습니다. 신용이 BB 이하면 정크본드입니다. 가격이 액면 아래로 떨어졌을 때 조기 상환하면 차익이 납니다."],["사모 유상증자와 백기사","내 회사가 거래 주체(나 또는 다른 내 회사)에게 신주를 배정해 내 그룹 지분을 늘립니다. 백기사는 중립 회사에 신주를 배정해 라이벌 지분을 희석합니다."],["자산 매물 시장","자금난에 빠진 회사의 사업 자산이 장부가보다 싸게 나옵니다. 같은 업종의 내 회사를 거래 주체로 골라 살 수 있어요."],["생산성 투자와 자동 경영","R&D나 광고에 투자하면 당장은 이익이 줄지만 몇 분기 뒤 수익성이 올라갑니다. 자동 경영을 켜면 회사가 분기마다 성장률·배당·투자를 알아서 조정합니다."],
["회사 설립","메뉴의 '회사 설립'에서 나 또는 내 회사(은행 제외) 명의로 새 회사를 세웁니다. 지주회사는 설립비 5억, 사업회사 10억, 은행·보험은 최소 1,000억에 50억입니다. 새 회사는 100% 비상장이고, 시즈닝 기간(1년 반) 동안은 상장과 정크본드 발행이 막힙니다. 창업은 1년에 2개, 2년에 3개까지예요. 사업회사는 처음 6분기 동안 자리를 잡느라 이익이 적습니다."],["자금 이동","나와 내 회사들 사이에서 돈을 옮깁니다. 현금 출자와 주식 현물출자는 100% 소유한 회사에만 할 수 있고(원작 규칙), 대여는 나만 할 수 있으며 기준금리 이자를 받습니다. 상장 자회사에는 신주 인수로 돈을 넣고, 회사에서 돈을 빼려면 특별배당이나 대여금 회수를 씁니다."],["지주회사와 Incorporate Yourself","지주회사는 사업 자산 없이 현금과 다른 회사 지분만 가집니다. 지주회사가 받는 배당은 비과세라서, 보유 주식을 지주회사에 현물출자해 두면 개인 배당세(40%)를 피하며 복리로 불릴 수 있어요. 지주회사가 자산 매물을 사면 그 업종의 사업회사가 됩니다."],["설립 국가","한국 법인은 적대적 공개매수 방어가 가장 강하고, 미국 법인은 주가 프리미엄이 붙는 대신 인수당하기 쉽습니다. 싱가포르는 법인세 25%로 무난하고, 케이맨 제도는 법인세 10%지만 주가가 할인되고 감독원 주목도가 분기마다 오릅니다."],["CEO 보상","내가 지배하는 회사에서 CEO로 취임하면 회사가 연봉을 줍니다. 연봉은 회사 규모(현금·투자 지분을 뺀 시가총액)에 비례하고 최소 1억입니다. 매년 이익이 15% 넘게 늘면 연말에 연봉의 1.5배, 2년 연속이면 3배, 3년 연속이면 5배 보너스를 받고, 지분 51% 이상이면 두 배(최소 1배)입니다. 연봉은 회사 돈이라 그만큼 회사 이익이 줄어요."],
["종목 화면 개요 (원작 구성)","개요 탭은 원작처럼 자산, 부채와 자본, 분기 주당순이익, 차입 현황, 분기 현금흐름, 운영 순서로 보여 줍니다. 내 회사면 각 줄 옆 버튼으로 바로 차입·상환, 회사채 발행, 자산 매입·매각, 배당·성장률·R&D 조정, 거래 은행 변경을 할 수 있어요. 탭 색은 원작 메뉴 색을 따랐습니다: 매매 초록, 경영 파랑, 인수 빨강, 재무 주황."],["세이브 백업과 앱","설정의 세이브 백업에서 지금 게임을 코드로 내보내고 다시 가져올 수 있어요. 앱을 지웠다 다시 깔거나, 웹 버전에서 하던 게임을 앱으로 옮길 때 쓰세요. 앱에서는 뒤로 버튼으로 창을 닫고, 첫 화면에서 두 번 누르면 종료됩니다. 앱을 내리면 게임이 멈추고 돌아오면 이어집니다."],
["시장 엔진 (v11)","주가는 매일 시장 흐름 × 베타 + 업종 흐름(유가·금값·코인·금리·수요와 설비) + 적정가 회귀 + 회사 고유 요인 + 실적·뉴스로 움직입니다. 종목 개요의 '왜 움직였나'에서 오늘과 최근 10일의 원인을 볼 수 있고, 실적 발표 때는 예상 EPS(컨센서스)와 비교한 서프라이즈만큼 주가가 뛰거나 빠집니다."],["지수와 차트","시장 탭의 지수에서 WSR 종합, 대형 50, 중소형, 업종 그룹·업종 지수, 공포지수, 금리를 볼 수 있어요. 차트는 1개월~1년 일봉과 월봉, 이동평균·볼린저밴드·거래량·RSI·MACD·스토캐스틱을 지원하고, 손가락으로 밀면 그날의 시가·고가·저가·종가가 나옵니다."],["재무제표","종목 화면 재무 탭에서 8분기의 손익계산서, 재무상태표, 현금흐름표와 PER·PBR·ROE 같은 투자지표를 업종 중간값과 비교해 볼 수 있어요."],["세밀한 조정","배당성향·성장률·R&D·증자·자사주·회사채·자산 매각·차입·매매·공개매수 프리미엄을 1 단위(매매는 0.1%)로 정할 수 있어요. '직접' 버튼이나 개요의 '조정' 버튼을 누르세요."],
["파생상품 (v12)","메뉴의 파생상품에서 원자재(금·은·원유·구리·밀)·지수·주식 선물을 만기별 곡선으로 보고 사고팔아요. 매일 손익이 증거금에 정산되고, 유지 증거금 아래로 떨어지면 마진콜이 와요. 옵션은 종목 매매 탭에서 행사가·만기·규모를 골라 사거나 쓰고(커버드 콜·네이키드), 깊은 내가격 콜은 행사해서 지분을 싸게 받을 수 있어요. 금리 스왑과 ETF(종합·대형·섹터·3배·인버스·국채·원자재·코인·팩터)도 있어요."],["코인 생태계","20여 개 코인이 성격(가치저장·플랫폼·스테이블·거래소·디파이·밈·AI·게임·프라이버시·결제)에 따라 움직여요. 강세장에 새 코인이 생기고, 러그풀·해킹·디페그·상장폐지로 사라져요. 레버리지(1~100배)는 코인 무기한 선물에서만 고를 수 있어요."],["경제와 블랙 스완","물가, 중앙은행(테일러 준칙), 단기·장기 금리와 역전, 신용 스프레드, 실업률, 환율, 경기 국면이 서로 맞물려 움직여요. 블랙 스완(팬데믹·전쟁·은행 파산·국가 부도·플래시 크래시·거래소 붕괴·기술 혁명 등)은 드물지만 시장을 뒤흔들어요. 새 게임에서 역사 시나리오(1970년대, 1987, 2000, 2008, 2020)도 고를 수 있어요."],["회사 사건과 결정권","파업·소송·리콜·해킹·수주·임상 등 30가지 사건이 생겨요. 내가 CEO면 직접 결정하고, 지배주주지만 CEO가 아니면 경영진 안을 보고 이사회를 통해 개입할 수 있어요(지분이 클수록 성공). 소액주주는 뉴스로만 알게 돼요. 설정에서 빈도와 종류를 바꿀 수 있어요."],["업종 특성과 은행","반도체·철강 같은 사이클 업종, 플랫폼, 바이오·게임 같은 히트 의존형, 원자재 연동, 규제 산업, 경기 방어, 금융은 각자 다른 방식으로 벌어요. 은행은 자산 배분과 BIS 비율을 관리하고, 부실 대출을 싸게 사서 회사를 차지할 수도 있어요(loan-to-own)."],["리서치와 AI 코치","모든 회사에는 시장이 모르는 숨은 경쟁력이나 시한폭탄이 있어요. 돈과 시간을 들여 리서치하면 남보다 먼저 알 수 있어요. AI 코치는 연말과 게임 종료 때 무엇이 잘됐고 문제였는지 짚어 주고, 내 회사 경영 탭에서 업종에 맞는 경영 조언을 해 줘요."],["챌린지와 관전","챌린지는 같은 주에 시작한 사람끼리 같은 세계에서 5년을 겨뤄요. 한 기기에서 번갈아 하는 같은 세계 대결, 실시간 레이스, 시드 공유도 있어요. 관전 모드에서는 AI 거장들끼리 경쟁하고 배울 점을 정리해 줘요. 전설 난이도의 라이벌은 해마다 배워요."],
["시계와 빨리 감기","위쪽 시계에서 ▶/⏸로 멈추고 1×·3×·10×·30×로 속도를 골라요. ⏭ 빨리 감기는 다음 달, 분기 결산, 연말, 6개월 뒤까지 최고 속도로 진행하고 도착하면 멈춰요. 멈춰 있을 때는 시계와 날짜가 주황색이에요. 설정의 자동 일시정지에서 가격 알림·경영권 위협·마진콜 같은 위험 경고·블랙 스완·분기 결산·연말 결산 때 저절로 멈추게 할 수 있어요."],["AI 참모 (레이더 참모)","메뉴의 AI 참모에게 한국어로 아무거나 물어보세요. '티커 사도 돼?', '인수할 만한 회사는?', '내 가장 큰 위험은?', '남는 현금 어떻게 굴릴까?', '경제 전망은?', 'PER이 뭐야?', '피드백 해줘' 같은 질문에 지금 게임 상황을 계산해서 답하고, 바로 실행할 버튼도 붙여 줘요. 게임 안에 들어 있어서 무료·무제한이고 인터넷도 필요 없어요. 설정에서 Claude나 제미나이를 켜면 같은 계산 결과로 한 번 더 자연스럽게 답해요."],["폰 안 AI","설정 › AI 설정에서 '폰 안 AI'를 고르고 모델을 받으면, 폰의 CPU에서 llama.cpp 언어모델이 직접 돌아가요. 앱(APK 1.8 이상)에서는 네이티브 엔진이 큰 코어 여러 개를 같이 써서 빨라요. 처음 한 번 와이파이로 약 1GB를 받은 뒤에는 인터넷 없이 무료·무제한이에요. 한국어 특화 EXAONE 4.0 1.2B(추천), 더 똑똑한 EXAONE 3.5 2.4B(앱 전용), 범용 Qwen2.5 1.5B 중에 고를 수 있어요. 참모가 계산한 사실을 자연스럽게 풀어 말해 주는 역할이라 숫자를 지어내지 않아요. 앱이 뒤로 가면 엔진을 잠시 끄고 돌아오면 다시 켜요."],["명령 센터","왼쪽 위 ＋ 버튼이 명령 센터예요. 메뉴가 원작 메뉴 바처럼 거래·분석·제국·배움·게임으로 묶여 있고, 맨 위 입력창에 메뉴 이름이나 초성(예: ㅍㅅ), 티커, 코인을 치면 바로 찾아요. BUY 티커 5 같은 명령어를 치고 Enter를 누르면 그대로 실행돼요. 자주 쓰는 메뉴는 편집에서 별표를 달면 홈 바로가기에도 나와요."],["편의 기능","종목 화면 아래 매매 바에서 바로 사고팔 수 있어요(설정에서 끌 수 있어요). 알림 토스트는 누르면 닫히고, 한꺼번에 여러 개가 오면 +숫자를 눌러 뉴스에서 모아 봐요. 글자 크기는 설정에서 작게·보통·크게로 바꿔요. 휴대폰에서는 화면 왼쪽 끝에서 오른쪽으로 밀면 뒤로 가고, PC에서는 Space(정지·재생), 1~4(배속), F(빨리 감기), / 또는 Ctrl+K(명령 센터) 단축키를 쓸 수 있어요."]];

function mk(tk,n,i,A,ipo){const kd=i===12?1:i===13?2:0,E=A*(kd?.09+rnd()*.03:ipo?.8:.45+rnd()*.3),cs=A*(kd===2?.25:kd===1?.08:ipo?.3:.04+rnd()*.04);

ni:A*(kd?.0035:ipo?.005:.016),eqi:0,dr:0,rm:-99,bk:0,ds:0,edge:ipo?(rnd()<.45?.01:-.05):0,cnt:0,vol:kd?.022:ipo?.08:.03+rnd()*.025+(i===1?.01:0),ctl:null,surp:0,cook:0,lit:0,pt:0,fo:0,sweep:1};
c.pni=c.ni;c.p=E*1e4/c.sh*(kd?1.3:ipo?1.6:1.1+nz()*.4);c.tg=c.p;c.hist=[Math.round(c.p)];c.hl=[[c.hist[0],c.hist[0]]];c.dh=c.dl=c.p;return c}

let b=null,m=0,m2=0;for(const r in g){const v=g[r];if(v>m){m2=m;m=v;b=r}else if(v>m2)m2=v}
let n=m>=20&&m>m2+1e-9?b:null;if(n==="c"+c.id)n=null;if(n!==c.ctl){c.ctl=n;ch=1}}if(!ch)break}S.cd=0}

function eq(c,d){d=d||0;return c.A+c.cs+c.gw-c.D+(c.fmg||0)+(d>3?0:pfv(c,d))}
const rating=c=>{const e=eq(c);if(e<=0)return 6;const r=c.D/e/(c.kd?9:1);return r<.3?0:r<.6?1:r<1?2:r<1.6?3:r<2.5?4:5};

const spv=c=>c.sb-mc(c)*c.sp/100,bd=c=>1-[0,.01,.03,.07,.14,.25,.5][rating(c)],bv=c=>c.bh*bd(c),gbv=()=>S.gb*S.bp/100;
const ncdf=x=>{const t=1/(1+.2316419*Math.abs(x)),p=.3989423*Math.exp(-x*x/2)*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p};
function bs(S0,K,T,s,r,call){const sq=s*Math.sqrt(T),d1=(Math.log(S0/K)+(r+s*s/2)*T)/sq,d2=d1-sq;return call?S0*ncdf(d1)-K*Math.exp(-r*T)*ncdf(d2):K*Math.exp(-r*T)*ncdf(-d2)-S0*ncdf(-d1)}
const opv=o=>{const c=S.co[o.i];return c.dead?0:o.nsh*bs(c.p,o.k,Math.max(1,o.exp-S.day)/360,c.vol*9,S.prime/100,o.t==="C")/1e4};

const ref10=h=>{const n=h.length;return n>1&&S.day%10<5?h[n-2]:h[n-1]},chg=c=>c.hn?c.ch:c.hist&&c.hist.length?c.p/ref10(c.hist)-1:0;

function tapeIx(){if(!S.IX)return"";const it=(n,k)=>{const o=S.IX[k];if(!o||!o.hn)return"";const a=o.lv[(o.hn-1)%DH]/100,b=o.hn>1?o.lv[(o.hn-2)%DH]/100:a,p=(a/b-1)*100;return `<span class="ti"><b>${n}</b> ${o.v.toFixed(k==="VIX"?1:1)} <i class="${p>=0?"up":"dn"}">${p>=0?"▲":"▼"}${Math.abs(p).toFixed(1)}%</i></span>`};

// screener technical conditions
function techOk(c,k){if(!c.hn||c.hn<30)return false;const s=dSeries(c,130),cl=s.c,n=cl.length;
if(k==="rsi"){const r=rsi(cl);return r[n-1]!=null&&r[n-1]<=30}
if(k==="gc"){const a=sma(cl,5),b=sma(cl,20);for(let j=Math.max(1,n-5);j<n;j++)if(a[j-1]!=null&&b[j-1]!=null&&a[j-1]<=b[j-1]&&a[j]>b[j])return true;return false}
if(k==="hi")return cl[n-1]>=Math.max(...s.h)*.97;
if(k==="vol"){const v=sma(s.v,20);return v[n-1]!=null&&s.v[n-1]>2*v[n-1]}
if(k==="up"){const m=[5,20,60,120].map(p=>sma(cl,p)[n-1]);return m.every(x=>x!=null)&&m[0]>m[1]&&m[1]>m[2]&&m[2]>m[3]}return true}

["why","주가는 왜 움직이나 — 이 게임의 시장 엔진","모든 움직임에는 이유가 있어요",
"<p>이 게임의 주가는 매일 다섯 가지 힘의 합으로 움직여요.</p><ul><li><b>시장</b>: 금리, 경기(GDP), 투자심리, 금융위기 같은 큰 흐름. 회사마다 <b>베타</b>(시장에 얼마나 민감한지)가 달라요. 베타 1.5면 시장이 1% 오를 때 평균 1.5% 움직여요.</li><li><b>업종</b>: 유가·금값·코인 가격, 금리 변화, 업종의 수요와 설비(공급) 균형, 업종 뉴스.</li><li><b>적정가 회귀</b>: 최근 4분기 이익과 자산으로 계산한 적정가에서 멀어질수록 끌려가는 힘. 다만 회사 소식이 쌓이면 시장이 그 회사를 더 좋게(혹은 나쁘게) 보게 되고, 이 <b>시장 기대</b>는 몇 년씩 남아요. 그래서 같은 이익이라도 회사마다 PER이 달라요.</li><li><b>회사 고유 요인</b>: 작은 회사일수록 크게 출렁여요.</li><li><b>이벤트</b>: 실적 발표, 신제품, 회계 의혹 등.</li></ul><p>금리 인상이나 금융위기 같은 충격은 일부가 <b>투자심리</b>로 남아서 하루 만에 회복되지 않고 몇 달~1년에 걸쳐 풀려요. 실제 시장처럼 하락장·상승장이 생기는 이유예요.</p><p><b>실적 발표</b> 때는 예상(컨센서스) EPS와 실제를 비교해요. 예상보다 좋으면 <b>어닝 서프라이즈</b>로 뛰고, 이후 며칠 더 오르는 경향이 있어요.</p>",
"종목 화면 개요의 '왜 움직였나'에서 오늘과 최근 10일의 원인을 볼 수 있어요. 큰 변동이 있는 날은 뉴스에 시황이 올라와요.",[["뉴스 보기","G.go('l')"]]],
["macro","금리와 경기","시장 전체를 움직이는 두 손잡이",
"<ul><li><b>기준금리</b>가 오르면 빚 이자가 늘고, 미래 이익의 현재 가치가 줄어 주가에 부담이에요. 특히 건설·부동산, 전력·가스, 성장주(인터넷, 2차전지)가 민감해요. 은행은 오히려 이익이 늘 수 있어요.</li><li><b>GDP 성장률</b>이 좋으면 경기민감 업종(반도체, 기계, 철강, 화학, 호텔·레저)이 강해요. 식음료, 주류·담배, 통신은 경기를 덜 타요(방어주).</li><li><b>금융위기</b>가 오면 모두 빠지지만, 그때 우량주를 싸게 모으는 사람이 다음 상승장에 큰돈을 벌어요.</li></ul>",
"은행·경제 탭에서 금리와 GDP를, 지수 화면에서 금리 차트를 볼 수 있어요.",[["은행·경제","G.go('b')"]]],
["sector","업종과 원자재","유가가 오르면 누가 웃나",
"<p>이 게임엔 30개 산업 + 은행·보험·지주회사가 있어요. 업종마다 민감한 재료가 달라요.</p><ul><li><b>유가↑</b>: 에너지·조선(일부) 웃음 / 항공·물류, 화학, 농업, 전력·가스 부담.</li><li><b>금값↑</b>: 광업·귀금속.</li><li><b>코인↑</b>: 증권·핀테크.</li><li><b>공급 과잉</b>: 업종 수요 성장보다 회사들의 설비 증가가 빠르면 이익률이 떨어져요. 반대로 공급 부족이면 마진이 좋아져요.</li></ul><p>원작 고수들은 한 업종의 큰 회사들을 지배한 뒤 성장률을 낮춰 공급을 줄이고 업종 전체 마진을 올렸어요(점유율 50% 넘으면 독점 소송 주의).</p>",
"섹터 화면의 히트맵과 수요·설비 수치를 보세요. ▲ 표시는 공급 부족 업종이에요.",[["섹터 보기","G.pg('sc')"]]],
["debt","빚과 신용등급","레버리지는 양날의 검",
"<p>빚(레버리지)을 쓰면 수익도 손실도 커져요. 자기 돈 100에 100을 빌려 200을 투자하면, 10% 오를 때 내 돈은 20% 불고, 10% 빠지면 20% 줄어요.</p><ul><li><b>신용등급</b>(AAA~D)은 부채비율로 정해져요. 등급이 낮으면 이자가 비싸고 대출 한도가 줄어요.</li><li><b>마진콜</b>: 개인 대출이 순자산의 3배를 넘으면 강제로 주식이 팔려요.</li><li><b>대출 회수</b>: 은행을 지배한 라이벌이 BB 이하 회사의 대출을 회수할 수 있어요. 내 은행으로 옮기면 안전해요.</li></ul>",
"경영 탭과 개요의 '차입 현황'에서 등급과 대출 여력을 확인하세요.",[]],
["bond","채권 — 국채와 회사채","이자를 받는 투자",
"<p><b>채권</b>은 돈을 빌려주고 이자를 받는 증서예요. <b>국채</b>는 나라가, <b>회사채</b>는 회사가 발행해요.</p><ul><li>금리가 오르면 이미 있는 채권 가격은 <b>내려가고</b>, 금리가 내리면 올라가요.</li><li>신용이 낮은 회사의 회사채(<b>정크본드</b>)는 이자가 높지만 파산하면 크게 잃어요.</li><li>내 회사는 회사채를 발행해 은행 한도와 별도로 인수 자금을 마련할 수 있어요.</li></ul>",
"은행·경제 탭에서 국채를, 종목 화면 매매 탭에서 회사채를 사요.",[]],
["ctl","경영권 — 20%와 최대 주주","회사를 내 것처럼",
"<p>한 회사의 지분을 <b>20% 이상</b> 갖고 <b>가장 큰 주주 그룹</b>이 되면 경영권을 얻어요. 그러면:</p><ul><li>배당, 성장률, R&D, 차입, 회사채, 자사주, 증자를 정할 수 있어요.</li><li>위쪽 <b>거래 주체</b>를 그 회사로 바꾸면 회사 돈으로 다른 회사를 살 수 있어요. 회사가 회사를 지배하는 <b>피라미드</b>가 원작의 핵심이에요.</li><li>CEO로 취임하면 연봉과 보너스를 받아요.</li></ul><p>라이벌이 지분을 모으면 경영권을 뺏길 수 있으니 '내 그룹' 지분을 넉넉히 유지하세요.</p>",
"종목 화면 매매 탭의 '경영권까지' 버튼, 거래 주체 칩, 제국 탭을 활용하세요.",[["제국 보기","G.go('e')"]]],
["ma","인수합병과 방어","회사를 통째로",
"<ul><li><b>공개매수</b>: 남은 주식 전부를 웃돈(프리미엄)을 얹어 현금으로 사요. 프리미엄이 낮으면 주주들이 거절해요.</li><li><b>LBO</b>: 30%만 내고 나머지는 인수 대상 회사가 빚을 지게 해요. 빚이 많아져 위험해요.</li><li><b>주식교환 합병</b>: 내 회사 신주를 주고 상대를 흡수해요.</li><li><b>그린메일</b>: 지분을 모아 회사에 비싸게 되사라고 압박.</li><li><b>방어</b>: 포이즌 필, 백기사(우호 세력에 신주 배정), 사모 증자로 내 지분 늘리기.</li></ul>",
"종목 화면 인수 탭에서 프리미엄을 1% 단위로 정해 제안할 수 있어요.",[]],
["found","회사 설립과 상장","직접 만들고 키우고 팔기",
"<ul><li><b>설립</b>: 지주회사, 사업회사(30개 업종), 은행·보험을 세울 수 있어요. 1년에 2개, 2년에 3개까지.</li><li><b>시즈닝</b>: 설립 후 1년 반은 상장·정크본드가 막혀요.</li><li><b>상장(IPO)</b>: 40%를 팔아 현금화. 가격은 실적과 장부가로 정해져요.</li><li><b>지주회사 + 현물출자</b>: 내 주식을 지주회사로 옮기면 받는 배당에 세금이 없어 복리로 불어나요(원작의 'Incorporate Yourself').</li></ul>",
"메뉴의 회사 설립과 자금 이동을 보세요.",[["회사 설립","G.fdOpen()"]]],
["deriv","공매도·옵션·선물","하락에도 베팅하기",
"<ul><li><b>공매도</b>: 주식을 빌려 팔고 나중에 사서 갚아요. 떨어지면 이익, 오르면 손실이 끝없이 커질 수 있어요.</li><li><b>콜옵션</b>: 정한 가격에 살 권리. 오를 때 크게 벌고, 안 오르면 옵션값만 잃어요. <b>풋옵션</b>은 반대.</li><li><b>지수선물</b>: 지수 상승·하락에 베팅. 내 포트폴리오 하락을 막는 '보험'(헤지)으로도 써요.</li></ul>",
"매매 탭(공매도·옵션), 파생상품 메뉴(선물)를 보세요.",[]],
["finco","은행과 보험","돈이 돈을 버는 업종",
"<ul><li><b>은행</b>은 예금으로 대출을 해 이자 차이로 벌어요. 은행을 지배하면 대출 장부에서 부실 회사의 대출을 회수해 헐값 매물을 만들 수 있어요.</li><li><b>보험사</b>는 보험료로 쌓인 현금(플로트)이 많아요. 그 현금이 인수 자금이 돼서 첫 지주회사로 인기예요.</li></ul>",
"은행·보험 회사의 경영 탭에서 대출 장부를 볼 수 있어요.",[]],
["tax","세금과 절세","남는 돈이 진짜 돈",
"<ul><li>개인이 받는 <b>배당</b>: 40% 세금.</li><li>개인 <b>매매 차익</b>: 22% (손실은 다음 이익과 상계).</li><li>회사의 법인세는 설립 국가에 따라 10~35%.</li><li>회사가 받는 배당: 지분 80% 이상 모회사와 지주회사는 비과세, 20% 이상 5%, 그 밖 10%.</li></ul><p>그래서 원작 고수들은 개인 명의 대신 지주회사 명의로 주식을 갖고, 배당을 지주회사에 쌓아 재투자했어요.</p>",
"자금 이동 → 주식 현물출자로 시작할 수 있어요.",[["자금 이동","G.mvOpen()"]]],
["risk","리스크 관리 — 망하지 않는 법","살아남는 사람이 이겨요",
"<ul><li>한 종목에 몰빵하지 않기. 업종도 나눠서.</li><li>빚은 감당할 만큼만. 금융위기는 반드시 와요.</li><li>공매도는 손실 한도를 정하고.</li><li>위험한 제안(내부정보, 분식회계)은 감독원 주목도를 올려요. 70 넘으면 구속될 수 있어요.</li><li>공포지수가 높을 땐 차분하게. 좋은 회사를 싸게 살 기회예요.</li></ul>",
"홈 화면의 감독원 주목도 막대를 늘 확인하세요.",[]],
["strat","원작 고수들의 전략","Wall Street Raider 플레이어들의 비법",
"<ul><li><b>현금흐름 눈덩이</b>: 배당 많은 회사 20%씩을 사서 지분법 이익과 배당을 모아 다음 회사를 삽니다.</li><li><b>LBO 후 재상장</b>: 저평가 회사를 LBO로 사서 경영 개선 후 다시 상장.</li><li><b>업종 장악</b>: 한 업종의 큰 회사들을 지배하고 성장률을 낮춰 공급을 줄이면 업종 마진이 올라가요.</li><li><b>은행 장악</b>: 은행을 지배하면 대출 회수로 경쟁 회사를 흔들 수 있어요.</li><li><b>보험사 = 금고</b>: 보험사의 현금으로 인수.</li></ul>",
"원작 매뉴얼의 전략을 이 게임 규칙에 맞게 옮겼어요.",[]]];

["BPS","주당순자산. 자본 ÷ 주식 수"],["PER","주가 ÷ EPS. 낮을수록 이익 대비 쌈"],["PBR","주가 ÷ BPS. 1 미만이면 장부가보다 쌈"],["ROE","순이익 ÷ 자본. 주주 돈으로 버는 비율"],["ROA","순이익 ÷ 총자산"],

// Every game has a seed. Each day the general random stream (_R) and separate world streams (market, macro, commodities,
// crypto, IPOs, black swans...) are re-seeded from (seed, day, stream). Two players with the same seed therefore live in the
// same world (macro, market and sector moves, company news and earnings noise) even when their own actions differ.
function mix32(a,b){let h=Math.imul((a|0)^0x9e3779b9,0x85ebca6b)^Math.imul((b|0)+0x632be5ab,0xc2b2ae35);h^=h>>>15;h=Math.imul(h,0x2c1b3c6d);h^=h>>>12;h=Math.imul(h,0x297a2d39);h^=h>>>15;return h>>>0}
function sfc32(a,b,c,d){return()=>{a|=0;b|=0;c|=0;d|=0;const t=(a+b|0)+d|0;d=d+1|0;a=b^b>>>9;b=c+(c<<3)|0;c=c<<21|c>>>11;c=c+t|0;return(t>>>0)/4294967296}}
function mkR(s,k){const a=mix32(s,k),b=mix32(a,k+1),c=mix32(b,k+2),d=mix32(c,k+3),f=sfc32(a,b,c,d);for(let j=0;j<12;j++)f();return f}
const wR=k=>mkR(mix32(S.seed|0,S.day),k);
function wRun(k,f){const g=_R;_R=wR(k);try{return f()}finally{_R=g}}

// counter-based noise for one company on one day: the same seed gives the same company news whatever else happened
const hu=(id,k)=>mix32(mix32(S.seed|0,S.day*131+k),id+7)/4294967296;
function hgn(id,k){let u=hu(id,k);if(u<1e-12)u=1e-12;return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307179586*hu(id,k+1))}
function hgz(id,k){const z=hgn(id,k);return hu(id,k+2)<.035?z*2.5:z}

const seedTxt=s=>{s=s>>>0;let t="";for(let k=0;k<6;k++){t+="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[s%32];s=Math.floor(s/32)}return t};

"은행·경제 탭의 경제 지표에서 금리 곡선, 물가, 실업률, 신용 스프레드, 환율과 중앙은행 기조를 보세요. 지수 화면에서 장단기 금리와 환율 차트도 볼 수 있어요.",[["경제 지표","G.pg('econ')"]]],
["bsw","블랙 스완 — 아무도 예상 못한 일","드물지만 시장을 뒤흔드는 사건",
"<p>17세기 유럽 사람들은 백조는 모두 희다고 믿었는데, 호주에서 검은 백조가 발견됐어요. 그래서 <b>블랙 스완</b>은 '일어날 리 없다고 믿었지만 일어나서 모든 걸 바꾸는 사건'을 뜻해요.</p><ul><li>팬데믹, 전쟁, 대형 은행 파산, 국가 부도, 플래시 크래시, 코인 거래소 붕괴, 서브프라임 붕괴 같은 나쁜 사건도 있고, 기술 혁명처럼 좋은 사건도 있어요.</li><li>예측은 거의 불가능해요. 대신 <b>버틸 수 있게</b> 준비해야 해요: 빚을 적게, 한 곳에 몰빵하지 않기, 현금 조금.</li><li>블랙 스완 때 가장 먼저 죽는 사람은 레버리지가 큰 사람이에요. 바닥에서 강제로 팔리니까요.</li><li>살아남은 사람에게는 위기가 곧 기회예요. 좋은 회사가 헐값이 되거든요.</li></ul>",
"설정에서 블랙 스완 빈도(끄기·드물게·보통·자주)를 고를 수 있어요. 새 게임의 역사 시나리오에서 실제 위기를 다시 겪어 볼 수도 있어요.",[]]);
bkIns("sector",["ind","업종마다 다른 사업 모델","반도체와 은행은 다르게 번다",
"<ul><li><b>경기·설비 사이클</b>(반도체·철강·화학·조선·2차전지·자동차·기계·전자): 3~4년마다 호황과 불황이 와요. 주가는 실적보다 먼저 움직여서, 실적이 가장 나쁠 때가 오히려 사기 좋은 때일 수 있어요.</li><li><b>플랫폼</b>(소프트웨어·인터넷): 1등이 다 가져가요. 점유율이 높을수록 마진이 커져요.</li><li><b>히트 의존</b>(제약·바이오, 게임·미디어): 임상 결과나 신작 흥행 하나로 회사 가치가 바뀌어요.</li><li><b>원자재 연동</b>(에너지·광업·농업): 유가·금값·곡물 가격이 곧 이익이에요.</li><li><b>규제 산업</b>(통신·전력·철도): 정부가 정해 준 만큼 안정적으로 벌지만, 금리가 오르면 약해요.</li><li><b>경기 방어</b>(식음료·생활용품·의료기기·주류): 불황에도 팔려요.</li><li><b>금융</b>: 은행은 예대마진과 BIS 비율, 보험은 보험 주기와 재해, 증권은 거래대금과 ETF 보수로 벌어요.</li></ul><p>업종마다 시장 점유율이 어떻게 나뉘었는지(1등이 몇 %인지)도 중요해요. 메뉴의 '점유율 분포'에서 HHI(집중도)와 상위 3개 점유율을 보세요.</p>",
"종목 화면 개요의 '업종 특성' 카드와, 내 회사 경영 탭의 '경영 코치'가 업종에 맞는 조언을 해 줘요.",[["점유율 분포","G.pg('shr')"]]],
["ctry","나라마다 다른 규칙","30개국의 세금, 방어력, 성장, 위험",
"<p>회사가 어느 나라에 세워졌는지에 따라 규칙이 달라져요.</p><ul><li><b>법인세</b>: 9%(아랍에미리트)부터 35%까지.</li><li><b>인수 방어력</b>: 일본·네덜란드·한국처럼 적대적 인수가 어려운 나라, 미국·영국처럼 쉬운 나라.</li><li><b>밸류에이션</b>: 같은 이익이라도 미국·인도·스위스 회사는 비싸게, 아르헨티나·남미 회사는 싸게 거래돼요.</li><li><b>성장</b>: 인도·베트남·중국처럼 경제가 빨리 크는 나라는 회사도 빨리 커요.</li><li><b>정치 위험</b>: 자본 통제·횡재세·국유화가 일어날 수 있어요.</li><li><b>노조</b>: 파업이 잦은 나라와 드문 나라가 있어요.</li><li><b>조세회피처</b>(케이맨·아일랜드·룩셈부르크): 세금은 적지만 감독원 주목도가 올라요.</li></ul>",
"회사 설립에서 나라를 고를 수 있고, 종목 화면에 회사의 국적이 표시돼요.",[["회사 설립","G.fdOpen()"]]]);
bkIns("deriv",["fut2","선물 심화 — 원자재·지수·주식선물","콘탱고, 증거금, 마진콜",
"<ul><li><b>선물</b>은 '정해진 날(만기)에 지금 정한 가격으로 사고팔기로 한 약속'이에요. 실제로는 대부분 만기 전에 반대 거래로 정리해요.</li><li><b>증거금</b>: 계약 가치 전부가 아니라 6~15%만 맡기고 거래해요. 그래서 작은 돈으로 큰 계약을 움직여요(레버리지).</li><li><b>일일 정산</b>: 매일 손익이 증거금에 더해지거나 빠져요. 유지 증거금 아래로 떨어지면 <b>마진콜</b> — 돈을 더 넣거나 강제로 청산당해요.</li><li><b>만기별 가격(곡선)</b>: 보통 먼 달이 더 비싸요(<b>콘탱고</b>, 보관비·이자 때문). 먼 달이 더 싸면(<b>백워데이션</b>) 시장은 지금 가격이 너무 높아 앞으로 떨어질 거라고 보는 거예요.</li><li><b>헤지</b>: 정유사가 원유 선물을 사 두면 유가가 올라도 원가를 고정할 수 있어요. 주식을 많이 가졌다면 지수선물을 팔아 하락에 대비할 수 있어요.</li><li><b>실물 인수</b>: 원자재 선물은 만기에 현금 대신 실물을 받을 수도 있어요(전체 대금 필요).</li></ul>",
"파생상품 메뉴의 선물 탭에서 원자재·지수·주식선물 곡선을 보고 계약을 사고팔 수 있어요. 레버리지를 고를 수 있는 건 코인 선물뿐이에요.",[["파생상품","G.pg('dv')"]]],
["opt2","옵션 심화 — 체인, 쓰기, 행사","보험을 사고팔기",
"<ul><li><b>옵션 체인</b>: 행사가와 만기별로 옵션값을 늘어놓은 표예요. 원작처럼 '1%당 비용'을 보면 비교가 쉬워요.</li><li><b>옵션 쓰기(매도)</b>: 옵션을 팔면 프리미엄을 바로 받아요. 대신 상대가 행사하면 의무를 져요. 보험회사처럼 '대부분은 안 터진다'에 거는 거예요.</li><li><b>커버드 콜</b>: 가진 주식을 담보로 콜을 팔아 추가 수입을 얻어요. 주가가 행사가를 넘으면 주식을 행사가에 넘겨줘요.</li><li><b>네이키드</b>: 담보 없이 팔면 손실이 끝없이 커질 수 있어 증거금이 필요해요.</li><li><b>풋 쓰기로 싸게 사기</b>: 풋을 팔았는데 주가가 떨어지면 행사가에 주식을 사게 돼요. 원래 사고 싶던 가격이라면 프리미엄까지 받는 셈이에요.</li><li><b>콜 행사로 지분 늘리기</b>: 깊이 내가격인 콜을 행사하면 시가보다 싸게 지분을 넘겨받아요.</li></ul>",
"종목 매매 탭의 '옵션 매수·쓰기' 버튼, 파생상품 메뉴에서 보유 옵션을 관리해요.",[]],
["swap","금리 스왑","고정금리와 변동금리를 바꾸기",
"<ul><li>A는 변동금리로 빌렸는데 금리가 오를까 걱정되고, B는 반대예요. 둘이 이자 흐름만 바꾸는 계약이 <b>금리 스왑</b>이에요. 원금은 오가지 않아요.</li><li><b>고정 받기</b>(롱): 고정금리를 받고 변동금리를 내요. 금리가 내리면 이익.</li><li><b>고정 내기</b>(숏): 금리가 오르면 이익. 변동금리 대출의 이자 상승을 막는 헤지예요.</li><li>은행·보험사가 상대방이 되고, 고객에게 불리한 금리(마진)를 붙여요. 내가 지배하는 금융회사가 거래하면 마진이 절반이에요.</li><li>원작처럼 스왑은 장부 밖(각주)에 있어요. 손익은 분기마다 현금으로 정산돼요.</li></ul>",
"파생상품 메뉴의 스왑 탭에서 기준금리·단기 국채·장기 국채 금리로 계약할 수 있어요.",[]],
["etf","ETF와 인덱스 투자","시장을 통째로 사기",
"<ul><li><b>ETF</b>는 여러 종목을 묶은 펀드를 주식처럼 사고파는 상품이에요. 종합지수 ETF 하나면 시장 전체를 사는 셈이에요.</li><li><b>보수</b>: 운용사가 매년 조금씩 떼어 가요(0.1~1%). 운용사(증권사)에게는 안정적인 수입이에요. 원작처럼 내 증권사가 다른 운용사의 운용권을 살 수도 있어요.</li><li><b>레버리지·인버스</b>: BULL은 하루 수익의 3배, BEAR는 −3배를 따라가요. 매일 다시 맞추기 때문에 오르락내리락하면 지수가 제자리여도 가치가 녹아요. 짧게만 쓰세요.</li><li><b>팩터 ETF</b>: 고배당·가치·모멘텀처럼 특정 성질의 종목을 모아요.</li><li>대부분의 전문가도 장기적으로 지수를 이기기 어려워요. 그래서 '그냥 지수를 사라'는 조언이 유명해요.</li></ul>",
"시장 탭의 ETF에서 사고팔 수 있어요.",[["ETF 보기","G.go('m');G.seg(4)"]]],
["coin","코인 생태계와 레버리지","태어나고 사라지는 코인들",
"<ul><li><b>비트코인</b>은 공급이 정해져 있고 4년마다 채굴 보상이 절반이 되는 <b>반감기</b>가 있어요. 반감기 뒤 1년쯤 큰 상승장이 오고, 그 뒤 '크립토 겨울'이 오곤 했어요.</li><li>코인마다 성격이 달라요: 플랫폼, 스테이블코인(1달러 고정), 거래소 토큰, 디파이, 밈, AI, 게임, 프라이버시, 결제.</li><li>강세장에는 새 코인이 쏟아지고, 대부분은 사라져요. <b>러그풀</b>(개발자가 돈을 들고 도망), 해킹, 상장폐지, 디페그가 흔해요.</li><li>시가총액이 작은 코인은 내 주문만으로도 가격이 크게 움직여요.</li><li><b>무기한 선물</b>: 만기가 없는 코인 선물. 1~100배 레버리지를 고를 수 있어요. 롱이 많으면 롱이 숏에게 <b>펀딩비</b>를 내요. 청산가에 닿으면 증거금을 전부 잃어요. 100배면 1%만 반대로 가도 끝!</li></ul>",
"시장 탭의 코인에서 현물과 선물을 거래하고, 생태계(탄생·소멸·광풍)를 볼 수 있어요.",[["코인 보기","G.go('m');G.seg(3)"]]]);
bkIns("finco",["bank2","은행 경영 — 자산 배분과 BIS 비율","은행장이 되어 보기",
"<ul><li>은행은 예금(빚)으로 대출과 채권을 사요. 이익 = 자산 이자 − 예금 이자 − 운영비 − 대손.</li><li><b>자산 배분</b>: 우량 주택담보(안전·저수익), 서브프라임(고수익·고위험), 소비자 신용(고수익·실업에 민감), 장기 국채(금리 오르면 평가손), 단기채(안전).</li><li><b>대손충당금</b>: 떼일 돈을 미리 비용으로 쌓아 두는 것. 미루면 지금 이익은 좋아 보이지만 나중에 한꺼번에 터져요.</li><li><b>BIS 비율</b> = 자본 ÷ 위험가중자산. 위험한 대출일수록 무겁게 쳐요. 10.5% 아래면 배당 금지, 8% 아래면 신규 대출 금지, 4% 아래면 뱅크런이 올 수 있어요.</li><li><b>대출 매매</b>: 부실한 회사의 대출을 다른 은행에서 싸게 사 둔 뒤 회수하면, 그 회사가 법정관리에 갈 때 대출이 지분으로 바뀌어 회사를 가질 수 있어요(loan-to-own).</li></ul>",
"내 은행의 경영 탭에서 자산 배분, BIS 비율, 대출 장부와 부실 대출 시장을 볼 수 있어요.",[]]);
bkIns("found",["corp","기업 행동과 시장 규칙","분할, 5% 공시, 상하한가, 배당락, 스톡옵션",
"<ul><li><b>액면분할</b>: 1주를 여러 주로 쪼개요. 회사 가치는 그대로지만 주가가 낮아져 사기 쉬워져요. <b>병합</b>은 반대.</li><li><b>5% 대량보유 공시</b>: 한 회사 지분을 5% 넘게 가지면(또는 1%p씩 바뀌면) 알려야 해요. 기업사냥꾼이 공시하면 시장은 인수를 기대해 주가가 뛰고, 뒤따라 사는 사람이 생겨 내가 더 사기가 비싸져요.</li><li><b>상한가·하한가</b>: 하루에 ±30%까지만 움직여요. 넘친 힘은 다음 날로 이어져요.</li><li><b>배당락</b>: 배당을 주는 날 주가가 배당만큼 떨어져요. 배당을 받아도 공짜는 아니에요.</li><li><b>연결납세</b>: 80% 이상 가진 자회사는 모회사와 세금을 합쳐 내요. 한쪽 손실로 다른 쪽 이익의 세금을 줄여요.</li><li><b>CEO 스톡옵션</b>: CEO는 분기마다 정해진 가격에 신주를 살 권리를 받아요. 1년 뒤부터 행사하면 시가보다 싸게 지분을 늘릴 수 있어요.</li><li><b>잔여 지분 강제 매수</b>: 90% 넘게 가지면 나머지를 사들여 100% 비상장으로 만들 수 있어요. 100%가 되면 자동으로 상장 폐지돼요.</li></ul>",
"내 회사 경영 탭에서 분할·병합, 강제 매수를, 내가 CEO인 회사에서 스톡옵션을 볼 수 있어요.",[]]);
bkIns("tax",["rsch","리서치 — 숨은 진주와 시한폭탄","남들보다 먼저 아는 법",
